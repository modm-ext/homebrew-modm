name: Test

on: [pull_request]

jobs:
  audit:
    runs-on: macos-15

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link checkout as tap
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/modm-ext"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/modm-ext/homebrew-modm"
          brew trust --tap modm-ext/modm

      - name: Brew style
        run: brew style modm-ext/modm

      - name: Brew audit
        if: ${{ !cancelled() }}
        run: brew audit --strict --online --tap modm-ext/modm

      # Only the changed formulae, fetching all toolchains would take ages
      - name: Verify checksums of changed formulae
        if: ${{ !cancelled() }}
        run: |
          git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}..." -- Formula | while read -r file; do
            formula="modm-ext/modm/$(basename "$file" .rb)"
            brew fetch --force --arch=arm "$formula"
            grep -q "depends_on arch: :arm64" "$file" || brew fetch --force --arch=intel "$formula"
            brew cleanup --prune=all "$formula"
          done

  macos_testing:
    runs-on: macos-15

    steps:
      # - name: Setup environment - Brew tap
      #   run: |
      #     ## Git repo needs to be checked of at ${{ github.ref }}, but brew can't do that :(
      #     #brew tap modm-ext/modm 
      # - name: Setup environment - Brew install
      #   run: |
      #     export HOMEBREW_NO_INSTALL_CLEANUP=1 # saves time
      #     brew update
      #     brew install arm-gcc-xpack@15
      #     brew install doxypress

      - name: Clone repo
        uses: actions/checkout@v4

      # Because `brew tap` is not able to use a specified git ref and brew no
      # longer installs formulae from files, we link the checkout as the tap
      - name: Brew install
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1 # saves time
          mkdir -p "$(brew --repository)/Library/Taps/modm-ext"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/modm-ext/homebrew-modm"
          brew trust --tap modm-ext/modm
          brew install protobuf # protoc for the nanopb examples
          brew install modm-ext/modm/arm-gcc-xpack@15
          echo "$(brew --prefix modm-ext/modm/arm-gcc-xpack@15)/bin" >> "$GITHUB_PATH"
          brew install --build-from-source modm-ext/modm/doxypress
          brew install modm-ext/modm/arm-gcc-bin@15

      - name: Environment info
        run: |
          echo "$PATH"
          env
          locale -a

      - name: Check arm-none-eabi-g++
        run: |
          which arm-none-eabi-g++
          arm-none-eabi-g++ --version

      - name: Check arm-gcc-bin@15
        run: |
          brew test modm-ext/modm/arm-gcc-bin@15

      - name: Check arm-none-eabi-gdb with Python
        run: |
          which arm-none-eabi-gdb-py3
          arm-none-eabi-gdb-py3 -batch -ex 'python import sys, ssl; print(sys.version)'

      - name: Check doxypress
        run: |
          which doxypress
          doxypress --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup environment - Python pip
        run: |
          pip3 install --user modm scons protobuf
          echo "/Users/runner/Library/Python/3.11/bin" >> "$GITHUB_PATH"

      - name: Update lbuild
        run: |
          pip3 install --upgrade --user --upgrade-strategy=eager modm

      - name: Clone modm
        uses: actions/checkout@v4
        with:
          repository: 'modm-io/modm'
          ref: 'develop'
          submodules: 'recursive'
          path: 'modm'

      - name: Compile some examples with arm-gcc-xpack toolchain
        run: |
          (cd modm/examples && ../tools/scripts/examples_compile.py . --target '^stm32f(031k6|103rb|303re|411re|746zg)')

      - name: Generate docs for gpio/blinky with doxypress
        run: |
          (cd modm/examples/gpio/blinky/ && lbuild build -m :docs && cd modm/docs && doxypress doxypress.json)
