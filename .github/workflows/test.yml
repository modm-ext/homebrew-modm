name: Test

on: [pull_request]

jobs:
  macos_testing:
    runs-on: macos-15

    steps:
      # - name: Setup environment - Brew tap
      #   run: |
      #     ## Git repo needs to be checked of at ${{ github.ref }}, but brew can't do that :(
      #     #brew tap modm-ext/modm 
      # - name: Setup environment - Brew install
      #   run: |
      #     export HOMEBREW_NO_INSTALL_CLEANUP=1 # saves time
      #     brew update
      #     brew install doxypress

      - name: Clone repo
        uses: actions/checkout@v4

      # Because `brew tap` is not able to use a specified git ref and brew no
      # longer installs formulae from files, we link the checkout as the tap
      - name: Brew install
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1 # saves time
          mkdir -p $(brew --repository)/Library/Taps/modm-ext
          ln -s $GITHUB_WORKSPACE $(brew --repository)/Library/Taps/modm-ext/homebrew-modm
          brew install --build-from-source modm-ext/modm/doxypress

      - name: Environment info
        run: |
          echo $PATH
          env
          locale -a

      - name: Check doxypress
        run: |
          which doxypress
          doxypress --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup environment - Python pip
        run: |
          pip3 install --user modm scons
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "/Users/runner/Library/Python/3.11/bin" >> $GITHUB_PATH

      - name: Update lbuild
        run: |
          pip3 install --upgrade --user --upgrade-strategy=eager modm

      - name: Clone modm
        uses: actions/checkout@v4
        with:
          repository: 'modm-io/modm'
          ref: 'develop'
          submodules: 'recursive'
          path: 'modm'

      - name: Generate docs for gpio/blinky with doxypress
        run: |
          (cd modm/examples/gpio/blinky/ && lbuild build -m :docs && cd modm/docs && doxypress doxypress.json)
